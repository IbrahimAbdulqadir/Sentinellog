<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}SentinelLog{% endblock %}</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <style>
    :root {
      --bg: #f8f9fb;
      --surface: #ffffff;
      --border: #e8eaed;
      --border-strong: #d1d5db;
      --text: #1a1d23;
      --text-secondary: #6b7280;
      --text-muted: #9ca3af;
      --accent: #3b82f6;
      --accent-bg: #eff6ff;
      --accent-text: #1d4ed8;
      --red: #ef4444;
      --red-bg: #fef2f2;
      --red-text: #b91c1c;
      --yellow: #f59e0b;
      --yellow-bg: #fffbeb;
      --yellow-text: #92400e;
      --green: #10b981;
      --green-bg: #f0fdf4;
      --green-text: #065f46;
      --radius: 8px;
      --sans: 'Inter', sans-serif;
      --mono: 'JetBrains Mono', monospace;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 14px; line-height: 1.6; min-height: 100vh; }

    /* ── Top Nav ── */
    .topnav {
      background: var(--surface); border-bottom: 1px solid var(--border);
      padding: 0 24px; display: flex; align-items: center;
      justify-content: space-between; height: 54px; position: sticky; top: 0; z-index: 100;
    }
    .nav-brand { display: flex; align-items: center; gap: 10px; text-decoration: none; }
    .brand-icon { width: 32px; height: 32px; border-radius: 8px; background: var(--accent); display: flex; align-items: center; justify-content: center; }
    .brand-icon i { font-size: 18px; color: #fff; }
    .brand-name { font-size: 16px; font-weight: 600; color: var(--text); }
    .nav-links { display: flex; align-items: center; gap: 2px; }
    .nav-link { display: flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: var(--radius); font-size: 13px; color: var(--text-secondary); cursor: pointer; text-decoration: none; transition: background .1s, color .1s; }
    .nav-link:hover { background: var(--bg); color: var(--text); }
    .nav-link.active { background: var(--accent-bg); color: var(--accent-text); font-weight: 500; }
    .nav-link i { font-size: 16px; }
    .nav-right { display: flex; align-items: center; gap: 10px; }
    .status-pill { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-secondary); padding: 5px 11px; border: 1px solid var(--border); border-radius: 99px; }
    .status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.5} }

    /* ── Buttons ── */
    .btn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; border-radius: var(--radius); font-size: 13px; font-weight: 500; cursor: pointer; transition: all .15s; border: none; text-decoration: none; }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: #2563eb; }
    .btn-ghost { background: transparent; color: var(--text); border: 1px solid var(--border-strong); }
    .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }
    .btn-danger { background: var(--red-bg); color: var(--red-text); border: 1px solid var(--red); }
    .btn-danger:hover { background: var(--red); color: #fff; }
    .btn-sm { padding: 5px 10px; font-size: 12px; }

    /* ── Layout ── */
    .content { padding: 28px 24px; max-width: 1200px; margin: 0 auto; }
    .page-head { margin-bottom: 24px; }
    .page-title { font-size: 22px; font-weight: 600; color: var(--text); }
    .page-sub { font-size: 13px; color: var(--text-muted); margin-top: 3px; }

    /* ── Cards ── */
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
    .card-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    .card-title { font-size: 13px; font-weight: 600; color: var(--text); }
    .card-link { font-size: 12px; color: var(--accent); cursor: pointer; text-decoration: none; }
    .card-link:hover { text-decoration: underline; }

    /* ── Metric cards ── */
    .metrics { display: grid; grid-template-columns: repeat(4,1fr); gap: 12px; margin-bottom: 20px; }
    .metric { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 18px 20px; }
    .metric-label { font-size: 12px; color: var(--text-muted); margin-bottom: 8px; display: flex; align-items: center; gap: 5px; }
    .metric-label i { font-size: 14px; }
    .metric-value { font-size: 30px; font-weight: 600; line-height: 1; }
    .metric-sub { font-size: 11px; color: var(--text-muted); margin-top: 5px; }
    .metric.m-blue .metric-value { color: var(--accent); }
    .metric.m-red .metric-value { color: var(--red); }
    .metric.m-amber .metric-value { color: var(--yellow); }
    .metric.m-green .metric-value { color: var(--green); }

    /* ── Pills / Badges ── */
    .pill { display: inline-flex; align-items: center; padding: 3px 9px; border-radius: 99px; font-size: 11px; font-weight: 500; white-space: nowrap; }
    .pill-red { background: var(--red-bg); color: var(--red-text); }
    .pill-amber { background: var(--yellow-bg); color: var(--yellow-text); }
    .pill-green { background: var(--green-bg); color: var(--green-text); }
    .pill-blue { background: var(--accent-bg); color: var(--accent-text); }
    .pill-gray { background: var(--bg); color: var(--text-secondary); border: 1px solid var(--border); }

    /* ── Alert items ── */
    .alert-item { display: flex; align-items: flex-start; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--border); }
    .alert-item:last-child { border-bottom: none; padding-bottom: 0; }
    .alert-icon { width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 16px; }
    .alert-icon.crit { background: var(--red-bg); color: var(--red); }
    .alert-icon.warn { background: var(--yellow-bg); color: var(--yellow); }
    .alert-title { font-size: 13px; font-weight: 500; color: var(--text); margin-bottom: 2px; }
    .alert-desc { font-size: 12px; color: var(--text-muted); }
    .alert-time { font-size: 11px; color: var(--text-muted); white-space: nowrap; margin-left: auto; padding-top: 2px; }

    /* ── Session items ── */
    .session-item { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--border); }
    .session-item:last-child { border-bottom: none; padding-bottom: 0; }
    .s-icon { width: 32px; height: 32px; border-radius: 8px; background: var(--accent-bg); color: var(--accent); display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; }
    .s-name { font-size: 13px; font-weight: 500; color: var(--text); }
    .s-meta { font-size: 12px; color: var(--text-muted); }

    /* ── Feed ── */
    .feed-item { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--border); font-size: 12px; font-family: var(--mono); }
    .feed-item:last-child { border-bottom: none; }
    .fd { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
    .fd.r { background: var(--red); }
    .fd.g { background: var(--green); }
    .fd.a { background: var(--yellow); }
    .feed-text { color: var(--text-secondary); flex: 1; }
    .feed-time { color: var(--text-muted); font-size: 11px; }

    /* ── Form ── */
    .form-group { margin-bottom: 18px; }
    .form-label { display: block; font-size: 12px; font-weight: 500; color: var(--text); margin-bottom: 6px; }
    .form-hint { font-size: 11px; color: var(--text-muted); margin-top: 5px; }
    .input, .textarea, .select { width: 100%; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); color: var(--text); font-family: var(--sans); font-size: 13px; padding: 9px 12px; outline: none; transition: border-color .15s; }
    .input:focus, .textarea:focus, .select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(59,130,246,.12); }
    .textarea { resize: vertical; min-height: 100px; }

    /* ── Mode cards ── */
    .mode-card { border: 1px solid var(--border); border-radius: 10px; padding: 16px; cursor: pointer; transition: all .15s; background: var(--surface); }
    .mode-card:hover { border-color: var(--border-strong); }
    .mode-card.selected { border-color: var(--accent); background: var(--accent-bg); }
    .mode-card .mode-icon { width: 36px; height: 36px; border-radius: 8px; background: var(--bg); display: flex; align-items: center; justify-content: center; margin-bottom: 10px; font-size: 18px; color: var(--text-secondary); }
    .mode-card.selected .mode-icon { background: var(--accent); color: #fff; }
    .mode-card .mode-title { font-size: 13px; font-weight: 600; color: var(--text); margin-bottom: 4px; }
    .mode-card .mode-desc { font-size: 12px; color: var(--text-muted); }

    /* ── Terminal (for log feed) ── */
    .terminal { background: #0f1117; border: 1px solid #1e2530; border-radius: 10px; padding: 16px; font-family: var(--mono); font-size: 12px; line-height: 1.8; overflow-y: auto; max-height: 380px; }
    .t-line { display: flex; gap: 10px; }
    .t-ts { color: #4a5568; flex-shrink: 0; }
    .t-ok { color: #10b981; }
    .t-fail { color: #ef4444; }
    .t-alert { color: #f59e0b; font-weight: 600; }
    .t-dim { color: #6b7280; }

    /* ── Grid ── */
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
    .row-2 { display: grid; grid-template-columns: 1.2fr 1fr; gap: 16px; }

    /* ── Utils ── */
    .flex-between { display: flex; align-items: center; justify-content: space-between; }
    .flex-center { display: flex; align-items: center; }
    .gap-8 { gap: 8px; } .gap-12 { gap: 12px; }
    .mt-4{margin-top:4px} .mt-8{margin-top:8px} .mt-12{margin-top:12px} .mt-16{margin-top:16px} .mt-20{margin-top:20px}
    .mb-4{margin-bottom:4px} .mb-8{margin-bottom:8px} .mb-12{margin-bottom:12px} .mb-16{margin-bottom:16px} .mb-20{margin-bottom:20px}
    .text-sm { font-size: 12px; } .text-xs { font-size: 11px; }
    .text-muted { color: var(--text-muted); } .text-secondary { color: var(--text-secondary); }
    .mono { font-family: var(--mono); }
    .truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .divider { border: none; border-top: 1px solid var(--border); margin: 16px 0; }
    .empty-state { text-align: center; padding: 48px 20px; }
    .empty-state-icon { font-size: 36px; color: var(--text-muted); margin-bottom: 10px; }
    .empty-state-title { font-size: 15px; font-weight: 500; color: var(--text); margin-bottom: 6px; }
    .empty-state-text { font-size: 13px; color: var(--text-muted); }
    ::-webkit-scrollbar { width: 4px; } ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 4px; }

    /* ── Rule tag ── */
    .rule-tag { display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 99px; font-size: 11px; font-weight: 500; }
    .rule-bf { background: var(--red-bg); color: var(--red-text); }
    .rule-st { background: var(--yellow-bg); color: var(--yellow-text); }


    /* ── Dark Mode ── */
    [data-theme="dark"] {
      --bg: #0f1117;
      --surface: #1a1d27;
      --border: #2a2d3a;
      --border-strong: #3a3d4a;
      --text: #e8edf5;
      --text-secondary: #9ca3af;
      --text-muted: #6b7280;
      --accent: #3b82f6;
      --accent-bg: #1e3a5f;
      --accent-text: #60a5fa;
      --red: #ef4444;
      --red-bg: #2a1515;
      --red-text: #f87171;
      --yellow: #f59e0b;
      --yellow-bg: #2a2010;
      --yellow-text: #fbbf24;
      --green: #10b981;
      --green-bg: #0f2a1f;
      --green-text: #34d399;
    }
    [data-theme="dark"] .terminal { background: #060809; }
    [data-theme="dark"] .mode-card .mode-icon { background: #2a2d3a; }
    [data-theme="dark"] body { background: var(--bg); }

    {% block extra_styles %}{% endblock %}
  </style>
</head>
<body>

  <nav class="topnav">
    <a href="/" class="nav-brand">
      <div class="brand-icon"><i class="ti ti-shield-check" aria-hidden="true"></i></div>
      <span class="brand-name">SentinelLog</span>
    </a>

    <div class="nav-links">
      <a href="/" class="nav-link {% if request.path == '/' %}active{% endif %}">
        <i class="ti ti-layout-dashboard" aria-hidden="true"></i>Dashboard
      </a>
      <a href="/alerts" class="nav-link {% if '/alerts' in request.path %}active{% endif %}">
        <i class="ti ti-bell" aria-hidden="true"></i>Alerts
      </a>
      <a href="/monitor/new" class="nav-link {% if '/monitor/new' in request.path %}active{% endif %}">
        <i class="ti ti-plus" aria-hidden="true"></i>New monitor
      </a>
    </div>

    <div class="nav-right">
      <div class="status-pill"><div class="status-dot"></div>Engine online</div>
      <button onclick="toggleTheme()" id="themeToggle" style="background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:6px 10px;cursor:pointer;display:flex;align-items:center;gap:5px;font-size:12px;color:var(--text-secondary);transition:all .15s">
        <i class="ti ti-moon" id="themeIcon" aria-hidden="true" style="font-size:16px"></i>
      </button>
      {% block topbar_actions %}{% endblock %}
    </div>
  </nav>

  <div class="content">
    {% block content %}{% endblock %}
  </div>

  <script>
    function timeAgo(isoStr) {
      if (!isoStr) return '—';
      const diff = Math.floor((Date.now() - new Date(isoStr)) / 1000);
      if (diff < 60) return `${diff}s ago`;
      if (diff < 3600) return `${Math.floor(diff/60)}m ago`;
      return `${Math.floor(diff/3600)}h ago`;
    }
  </script>
  {% block extra_scripts %}{% endblock %}

  <script>
    // Theme management
    function applyTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      localStorage.setItem('sl-theme', theme);
      const icon = document.getElementById('themeIcon');
      if (icon) {
        icon.className = theme === 'dark' ? 'ti ti-sun' : 'ti ti-moon';
      }
    }

    function toggleTheme() {
      const current = document.documentElement.getAttribute('data-theme') || 'light';
      applyTheme(current === 'dark' ? 'light' : 'dark');
    }

    // Apply saved theme immediately on load
    const saved = localStorage.getItem('sl-theme') || 'light';
    applyTheme(saved);
  </script>

</body>
</html>
